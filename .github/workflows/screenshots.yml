# Screenshots: renders every screen of the app (Roborazzi, the same goldens the pr workflow can
# compare) in dark, light, 200% font and right to left, and commits them to the "screenshots" branch.
# Run it from the Actions tab, or push to the record-screenshots branch. Once the images look right,
# they can be merged into main and verifyRoborazziDebug put back into pr.yml.
name: screenshots

on:
  workflow_dispatch:
  push:
    branches: ["record-screenshots"]

permissions:
  contents: write   # push the screenshots branch

concurrency:
  group: screenshots
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Record every screen
        # A shot whose accessibility check fails still writes its image first; keep going.
        continue-on-error: true
        run: ./gradlew recordRoborazziDebug --continue --console=plain

      - name: Commit them to the screenshots branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B screenshots
          git add -A -- '*/src/test/screenshots/*.png'
          git commit -q -m "Screenshots of ${GITHUB_SHA::8} (recordRoborazziDebug)" || echo "no changes"
          git push -f origin screenshots
