# The All apps build: a signed release APK of this fork, with the All apps screen, that installs
# beside the official app (applicationId tv.cleanyour.app.allapps, -Pcleanyourtv.allApps=true).
#
# Run it from the Actions tab ("allapps-apk", Run workflow), or push to the allapps branch. The APK
# is the run's artifact "cleanyourtv-allapps".
#
# Signing: add two repository secrets (Settings > Secrets and variables > Actions) so every build
# has the same key and installs over the last one:
#   ALLAPPS_KEYSTORE_B64       the keystore (PKCS#12), base64 on one line
#   ALLAPPS_KEYSTORE_PASSWORD  its password
# Without them the run makes a new key and uploads it as the artifact "allapps-keystore"; save it as
# the two secrets, or the next build cannot install over this one (Android refuses another key).
name: allapps-apk

on:
  workflow_dispatch:
  push:
    branches: ["allapps"]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true   # third_party/cleanyourtv at the pinned launcher commit
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ALLAPPS_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALLAPPS_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/key"
          ks="$RUNNER_TEMP/key/allapps.p12"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            pw="$KEYSTORE_PASSWORD"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            pw="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -storepass "$pw" -keypass "$pw" \
              -alias cleanyourtv -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Clean Your TV All apps"
            base64 -w0 "$ks" > "$RUNNER_TEMP/key/ALLAPPS_KEYSTORE_B64.txt"
            printf '%s' "$pw" > "$RUNNER_TEMP/key/ALLAPPS_KEYSTORE_PASSWORD.txt"
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets: a new key was made. Save the allapps-keystore artifact as the two secrets so the next build installs over this one."
          fi
          printf '%s' "$pw" > "$RUNNER_TEMP/key/pw.txt"
          echo "CYT_RELEASE_KEYSTORE=$ks" >> "$GITHUB_ENV"
          echo "CYT_RELEASE_KEYSTORE_PASSWORD_FILE=$RUNNER_TEMP/key/pw.txt" >> "$GITHUB_ENV"

      - name: Build the All apps APK (full flavour, release, R8)
        run: ./gradlew :app:assembleFullRelease -Pcleanyourtv.allApps=true --console=plain

      - name: Name the APK
        run: |
          mkdir -p out
          apk=$(ls app/build/outputs/apk/full/release/*.apk | head -n 1)
          cp "$apk" out/cleanyourtv-allapps.apk
          ls -l out
          sha256sum out/cleanyourtv-allapps.apk | tee out/cleanyourtv-allapps.apk.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cleanyourtv-allapps
          path: out/
          retention-days: 30

      - name: The new key, to save as secrets
        if: steps.key.outputs.generated == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: allapps-keystore
          path: |
            ${{ runner.temp }}/key/ALLAPPS_KEYSTORE_B64.txt
            ${{ runner.temp }}/key/ALLAPPS_KEYSTORE_PASSWORD.txt
          retention-days: 7
